<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" stroke="#1e293b" stroke-width="8"/>

  <!-- Glowing Interval Soundwave & Running Wings -->
  <g filter="url(#glow)">
    <!-- Dynamic audio / pace bars -->
    <rect x="80" y="240" width="32" height="80" rx="16" fill="#06b6d4" opacity="0.8"/>
    <rect x="136" y="180" width="32" height="150" rx="16" fill="#14b8a6"/>
    <rect x="192" y="110" width="32" height="230" rx="16" fill="url(#neonGrad)"/>
    <rect x="248" y="150" width="32" height="185" rx="16" fill="#10b981"/>
    <rect x="304" y="210" width="32" height="115" rx="16" fill="#06b6d4"/>
    <rect x="360" y="160" width="32" height="175" rx="16" fill="url(#neonGrad)"/>
    <rect x="416" y="240" width="32" height="75" rx="16" fill="#14b8a6" opacity="0.8"/>
  </g>

  <!-- Lightning speed accent -->
  <path d="M 276 90 L 220 230 L 290 230 L 236 410 L 330 250 L 260 250 Z" fill="#22c55e" opacity="0.95" />

  <!-- Interval Coach text badge -->
  <text x="256" y="465" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="44" fill="#ffffff" text-anchor="middle" letter-spacing="4">INTERVAL COACH</text>
</svg>

